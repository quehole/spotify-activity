<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111315">
  <title>Spotify Activity Card</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px;
      background: #111315; color: #f5f5f5; font: 15px/1.5 Arial, sans-serif; }
    main { width: min(100%, 540px); padding: 28px; border: 1px solid #303438;
      border-radius: 18px; background: #191b1d; }
    .eyebrow { color: #1ed760; font-size: 11px; font-weight: 700; letter-spacing: .16em; }
    h1 { margin: 8px 0; font-size: 25px; }
    p { color: #aeb4b8; }
    img { display: block; width: 100%; height: auto; margin: 22px 0 14px; }
    a { color: #1ed760; }
    code { color: #d8fbe4; }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">SPOTIFY ACTIVITY</div>
    <h1>Your live listening card</h1>
    <p>This project serves an SVG activity card for your GitHub profile. The card endpoint is:</p>
    <p><a href="/api/spotify"><code>/api/spotify</code></a></p>
    <img src="/api/spotify" alt="Live Spotify listening activity card">
    <p>Add <code>/api/spotify</code> to your GitHub README image URL. The root page is just this project information page.</p>
  </main>
</body>
</html>
